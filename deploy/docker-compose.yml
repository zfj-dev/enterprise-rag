# A+B 部署（本机 + 局域网给身边人用）——演示模式开箱即用（sqlite + 内存向量 + 假模型）。
# 前端已烤进镜像，不依赖宿主挂载/文件共享。
#
# ⚠️ 启动前必须在本目录放一个 .env（可从 .env.example 复制），并设一个**真随机**的 SECRET_KEY：
#     python -c "import secrets;print(secrets.token_urlsafe(48))"
#   这里刻意**不给默认值**：SECRET_KEY 是签 JWT 的密钥，写死在编排里等于把管理员身份公开。
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/rag.db
      - SECRET_KEY=${SECRET_KEY:?请在 deploy/.env 里设置 SECRET_KEY，见文件头注释}
      # 管理员 admin 的初始口令。留空 -> 演示模式回落公开的 admin123（启动日志会提醒）。
      # 设了就按它建（只在该用户还不存在时生效；之后改密走 /auth/change-password）。
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - USE_REAL=false
      - EMBEDDING_PROVIDER=fake
      - RERANKER_PROVIDER=fake
      # 演示模式 = 假模型。**这里不能填真 provider**：`USE_REAL` 只影响 /health 的显示，
      # 真正决定调哪个模型的是 LLM_PROVIDER —— 写成 openai 会让每次提问真的去打外部 API，
      # 配上占位 Key 就是 401，而流从中途断掉、前端只看到半句答案（看着像模型抽风）。
      - LLM_PROVIDER=fake
      - VECTOR_STORE=inmemory
      - MAX_UPLOAD_MB=50
    volumes:
      - rag_data:/app/data
      - rag_upload:/app/uploaded_files
      # ⚠️ 升级注意：镜像现在以**非 root 用户 app** 运行。全新创建的具名卷会从镜像目录
      # 继承 app 的属主，没问题；但**这个 compose 以前跑过**、卷已经存在的话，那卷是
      # root 属主，app 写不进去（上传/建库会失败）。一次性修一下：
      #     docker run --rm -v rag_rag_upload:/d alpine chown -R 1000:1000 /d
      #     docker run --rm -v rag_rag_data:/d   alpine chown -R 1000:1000 /d
    restart: unless-stopped

volumes:
  rag_data:
  rag_upload:
