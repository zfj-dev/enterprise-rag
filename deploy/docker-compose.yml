# A+B 部署（本机 + 局域网给身边人用）——演示模式开箱即用（sqlite + 内存向量 + 假模型）。
# 前端已烤进镜像，不依赖宿主挂载/文件共享。
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/rag.db
      - SECRET_KEY=change-me-in-prod
      - USE_REAL=false
      - EMBEDDING_PROVIDER=fake
      - RERANKER_PROVIDER=fake
      - LLM_PROVIDER=openai
      - LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - LLM_API_KEY=replace_with_your_key
      - LLM_MODEL=qwen-plus
      - VECTOR_STORE=inmemory
      - MAX_UPLOAD_MB=50
    volumes:
      - rag_data:/app/data
      - rag_upload:/app/uploaded_files
    restart: unless-stopped

volumes:
  rag_data:
  rag_upload:
