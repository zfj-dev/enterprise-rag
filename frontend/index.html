<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能文档问答</title>
<script src="https://cdn.bootcdn.net/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root{
    --text-primary:#1a1a1a;
    --text-secondary:#3a3a3a;
    --text-tertiary:#6b6b6b;
    --text-quaternary:#999;
    --surface:#ffffff;
    --surface-muted:#f5f5f5;
    --surface-hover:#f0f0f0;
    --border:#e8e8e8;
    --border-strong:#d0d0d0;
    --accent:#1677ff;
    --accent-weak:rgba(22,119,255,.10);
    --danger:#ff4d4f;
    --shadow-input:0 2px 12px rgba(0,0,0,.06);
    --shadow-menu:0 4px 20px rgba(0,0,0,.12);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
  }
  [data-theme="dark"]{
    --text-primary:#e6e6e6;
    --text-secondary:#d1d1d1;
    --text-tertiary:#8c8c8c;
    --text-quaternary:#595959;
    --surface:#0d0d0d;
    --surface-muted:#1f1f1f;
    --surface-hover:#262626;
    --border:#303030;
    --border-strong:#3a3a3a;
    --accent:#3c89ff;
    --accent-weak:rgba(60,137,255,.15);
    --danger:#ff7875;
    --shadow-input:0 2px 12px rgba(0,0,0,.4);
    --shadow-menu:0 4px 20px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--text-primary);font-size:15px;line-height:1.85;transition:background .2s ease-out,color .2s ease-out;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-weight:400;transition:all .2s ease-out}
  input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface);color:var(--text-primary);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .hide{display:none!important}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}

  /* ===== 登录 ===== */
  #loginCard{max-width:420px;margin:14vh auto;padding:36px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-input)}
  #loginCard h1{font-size:20px;font-weight:500;margin-bottom:4px}
  #loginCard .sub{color:var(--text-tertiary);font-size:13px;margin-bottom:22px}
  #loginCard input{width:100%;margin-bottom:12px}
  .login-row{display:flex;gap:10px}
  .btn-primary{background:var(--accent);color:#fff;padding:9px 18px;border-radius:var(--radius-sm);font-size:14px}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{border:1px solid var(--border-strong);padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-secondary)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  #loginMsg{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}

  /* ===== 布局 ===== */
  .app{display:flex;height:100vh;overflow:hidden}

  /* 侧边栏 */
  .sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
  @media (min-width:1280px){ .sidebar.closed{width:0;padding:0;overflow:hidden;border-right:none} .hamburger{display:inline-flex} }
  .side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
  .logo{width:28px;height:28px;border-radius:8px;background:var(--text-primary);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--surface)}
  .brand-name{font-size:15px;font-weight:500}
  .side-new{padding:6px 16px}
  .side-new button{width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text-primary);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
  .side-new button:hover{border-color:var(--accent);box-shadow:var(--shadow-input)}
  .side-nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text-secondary);cursor:pointer}
  .nav-item:hover{background:var(--surface-muted)}
  .nav-item svg{width:16px;height:16px;flex-shrink:0}
  .side-divider{height:1px;background:var(--border);margin:6px 12px}
  .session-list{flex:1;overflow-y:auto;padding:4px 8px}
  .sess-group{font-size:11px;letter-spacing:.5px;color:var(--text-quaternary);text-transform:uppercase;padding:10px 10px 4px}
  .sess-item{display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-left:3px solid transparent;position:relative}
  .sess-item:hover{background:var(--surface-muted)}
  .sess-item.active{background:var(--surface-muted);border-left-color:var(--accent);font-weight:500;color:var(--text-primary)}
  .sess-item .st{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess-item .more{opacity:0;font-size:14px;color:var(--text-quaternary);padding:0 2px}
  .sess-item:hover .more{opacity:1}
  .side-empty{padding:30px 16px;text-align:center;color:var(--text-quaternary);font-size:13px}
  .side-bottom{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--text-primary);color:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .user-name{font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ver-tag{font-size:11px;color:var(--text-quaternary)}
  .mode-badge{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:1px 6px;margin-left:6px;flex-shrink:0}
  .user-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;border-radius:8px;padding:4px 6px}
  .user-btn:hover{background:var(--surface-muted)}
  .um-c{max-width:380px;text-align:center}
  .um-avatar{width:56px;height:56px;border-radius:50%;background:var(--text-primary);color:var(--surface);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
  .um-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;text-align:left}
  .um-row .k{color:var(--text-secondary)}
  .um-btns{display:flex;gap:8px;margin-top:16px}
  .um-btns button{flex:1;padding:9px;border-radius:8px}
  .um-btns .btn-danger{background:var(--danger);color:#fff}

  /* 中央 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .chat-top{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--surface)}
  .chat-top .title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-top .spacer{flex:1}
  .icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:16px}
  .icon-btn:hover{background:var(--surface-muted);color:var(--text-primary)}
  #chatBox{flex:1;overflow-y:auto;padding:28px 24px;min-height:0}
  .chat-inner{max-width:760px;margin:0 auto}
  .msg{display:flex;margin-bottom:40px;animation:msgIn .3s ease-out}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{justify-content:flex-end}
  .msg.ai{justify-content:flex-start}
  .bubble{max-width:70%;padding:12px 18px;font-size:15px;line-height:1.85;word-break:break-word}
  .msg.user .bubble{background:var(--surface-muted);border:1px solid var(--border);border-radius:18px 4px 18px 18px;color:var(--text-primary)}
  .msg.ai .bubble{max-width:100%;padding:0;background:none}
  .ai-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ai-head .logo{width:26px;height:26px;border-radius:8px}
  .ai-head .ai-label{font-size:12px;color:var(--text-tertiary)}
  .ai-body{color:var(--text-secondary)}
  .ai-body table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .ai-body th,.ai-body td{border:1px solid var(--border);padding:6px 10px;text-align:left}
  .ai-body th{background:var(--surface-muted);font-weight:500}
  .ai-body code{background:var(--surface-muted);padding:1px 5px;border-radius:4px;font-size:12px;font-family:"JetBrains Mono",Consolas,monospace}
  .ai-body pre{background:var(--surface-muted);border:1px solid var(--border);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0}
  .ai-body pre code{background:none;padding:0}
  .ai-body h1,.ai-body h2,.ai-body h3{font-size:16px;font-weight:500;margin:14px 0 6px;color:var(--text-primary)}
  .ai-body ul,.ai-body ol{padding-left:20px;margin:8px 0}
  .ai-body p{margin:8px 0}
  .ref-tag{display:inline-block;background:var(--accent-weak);color:var(--accent);border-radius:6px;padding:2px 6px;font-size:11px;margin:2px 4px 2px 0;cursor:pointer;font-variant-numeric:tabular-nums}
  .thinking-panel{border:1px solid var(--border);background:var(--surface-muted);border-radius:10px;margin:8px 0;overflow:hidden}
  .thinking-head{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--text-tertiary);cursor:pointer;font-style:italic}
  .thinking-head .arrow{transition:transform .2s;font-size:11px}
  .thinking-head.open .arrow{transform:rotate(90deg)}
  .thinking-body{padding:0 12px 10px;font-size:13px;color:var(--text-quaternary);font-style:italic;line-height:1.7}
  .src-card{margin-top:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-muted);padding:12px 14px}
  .src-card .src-title{font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
  .src-card .ref-wrap{display:flex;flex-wrap:wrap;gap:6px}
  .msg-actions{display:flex;gap:6px;margin-top:12px;opacity:0;transition:opacity .2s}
  .msg:hover .msg-actions{opacity:1}
  .act-btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-tertiary);border-radius:8px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:4px}
  .act-btn:hover{border-color:var(--accent);color:var(--accent)}
  .act-btn.danger:hover{border-color:var(--danger);color:var(--danger)}

  /* 空状态 */
  .welcome{text-align:center;padding:8vh 0 4vh}
  .welcome h2{font-size:20px;font-weight:500;margin-bottom:28px;color:var(--text-primary)}
  .welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
  .wel-card{border:1px solid var(--border);border-radius:12px;background:var(--surface-muted);padding:16px;text-align:left;cursor:pointer;transition:all .2s}
  .wel-card:hover{border-color:var(--border-strong);background:var(--surface);box-shadow:var(--shadow-input)}
  .wel-card .wc-icon{font-size:18px;margin-bottom:8px}
  .wel-card .wc-t{font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
  .wel-card .wc-d{font-size:12px;color:var(--text-tertiary)}

  /* 输入区 */
  .input-area{padding:0 24px 16px}
  .input-wrap{max-width:760px;margin:0 auto}
  .quick-sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .sugg{background:var(--surface-muted);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-tertiary)}
  .sugg:hover{border-color:var(--border-strong);background:var(--surface);color:var(--text-primary)}
  .attach-preview{display:flex;align-items:center;gap:8px;background:var(--surface-muted);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;margin-bottom:8px;max-width:300px}
  .attach-preview .x{cursor:pointer;color:var(--text-quaternary);margin-left:auto}
  .input-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;box-shadow:var(--shadow-input);padding:10px 14px;transition:border-color .2s}
  .input-box:focus-within{border-color:var(--accent)}
  textarea#question{width:100%;border:none;background:transparent;resize:none;max-height:144px;padding:4px 0;font-size:15px;line-height:1.6;outline:none}
  .input-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .tool-left,.tool-right{display:flex;align-items:center;gap:6px}
  .tool-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:var(--surface-muted);color:var(--text-tertiary);font-size:12px}
  .tool-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
  .tool-btn svg{width:15px;height:15px}
  .plus-btn{width:34px;height:34px;border-radius:50%;background:var(--surface-muted);color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:18px}
  .plus-btn:hover{background:var(--surface-hover)}
  .send-btn{width:34px;height:34px;border-radius:10px;background:var(--text-primary);color:var(--surface);display:flex;align-items:center;justify-content:center}
  .send-btn:hover{opacity:.85}
  .send-btn:disabled{background:var(--border-strong);color:var(--text-quaternary);cursor:not-allowed}
  .src-modal{width:min(760px,94vw);max-width:760px}
  .src-text{white-space:pre-wrap;line-height:1.7;font-size:14px;color:var(--text-secondary);word-break:break-word;overflow-wrap:anywhere}
  .src-modal-title{font-size:13px;font-weight:600;color:var(--text-primary)}
  .src-modal-body{max-height:60vh;overflow:auto;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);line-height:1.7;font-size:14px;color:var(--text-secondary);white-space:pre-wrap;margin-top:8px}
  @keyframes srcFlash{0%{background:#ffe08a}15%{background:transparent}30%{background:#ffe08a}45%{background:transparent}60%{background:#ffe08a}75%{background:transparent}100%{background:transparent}}
  .src-page{margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px}
  .src-pg-num{font-size:12px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px}
  #rightPanel .src-flash{animation:srcFlash 2.2s ease 1}
  #srcPrev{flex:1;overflow-y:auto;padding:12px;min-height:0}
  #srcPrev.hide{display:none}
  #rightPanel .src-text{white-space:pre-wrap;line-height:1.6;font-size:13px;color:var(--text-secondary)}
  .doc-view{flex:1;flex-direction:column;overflow:hidden;background:var(--surface)}
  .doc-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .doc-body{flex:1;display:flex;overflow:hidden;min-height:0}
  .doc-list-col{flex:0 0 42%;min-width:280px;max-width:520px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .doc-list-head{padding:10px 12px;border-bottom:1px solid var(--border)}
  .doc-list{flex:1;overflow-y:auto;padding:8px}
  .doc-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
  .doc-item:hover{border-color:var(--accent)}
  .doc-item.selected{border-color:var(--accent);background:var(--accent-weak)}
  .doc-item .doc-nm{font-size:13px;font-weight:600;color:var(--text-primary);word-break:break-all}
  .doc-item .doc-meta{font-size:11px;color:var(--text-quaternary);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .doc-item .st.ok{color:var(--accent)} .doc-item .st.fail{color:#e5484d} .doc-item .st.run{color:#f5a524}
  .doc-item .doc-del{cursor:pointer}
  .doc-item .doc-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
  .doc-preview-col{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
  .doc-preview{flex:1;overflow:auto;padding:12px}
  .preview-empty{color:var(--text-quaternary);font-size:13px;text-align:center;margin-top:40px}
  .pv-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .pv-head span{font-weight:600;font-size:13px;flex:1;word-break:break-all}
  .pv-dl{font-size:12px;color:var(--accent);text-decoration:none}
  .pv-frame{width:100%;height:calc(100vh - 170px);border:none;border-radius:8px;background:#fff}
  .input-hint{text-align:center;font-size:11px;color:var(--text-quaternary);margin-top:8px}
  .menu{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-menu);padding:4px;z-index:100;min-width:160px;animation:menuIn .2s ease-out}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text-secondary);cursor:pointer}
  .menu-item:hover{background:var(--surface-muted)}
  .menu-item.danger{color:var(--danger)}

  /* 右侧面板 */
  .right-panel{width:280px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;transition:width .3s cubic-bezier(.4,0,.2,1);position:relative}
  .rp-resize{position:fixed;top:0;bottom:0;width:12px;cursor:col-resize;z-index:60;background:transparent}
  .rp-fab{position:fixed;right:0;top:40%;z-index:59;width:22px;height:60px;border-radius:8px 0 0 8px;background:var(--surface);border:1px solid var(--border);border-right:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-menu);font-size:14px;color:var(--text-tertiary)}
  .rp-fab:hover{color:var(--accent);background:var(--surface-muted)}
  .rp-resize:hover{background:var(--accent-weak)}
  .src-docbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-secondary)}
  .src-docbar .dn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .src-docbar a,.src-docbar button{color:var(--accent);text-decoration:none;background:none;border:none;padding:0;font-size:12px;cursor:pointer}
  @media (min-width:1440px){ .right-panel.closed{width:0;padding:0;overflow:hidden;border-left:none} }
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--border)}
  .panel-head h3{font-size:14px;font-weight:500}
  .panel-section{padding:0 16px 16px}
  .doc-card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;position:relative}
  .doc-card:hover{border-color:var(--border-strong)}
  .doc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .doc-icon.pdf{background:#fee2e2;color:#dc2626}.doc-icon.docx{background:#dbeafe;color:#2563eb}.doc-icon.xlsx{background:#dcfce7;color:#16a34a}.doc-icon.txt{background:#f3e8ff;color:#9333ea}
  .doc-info{flex:1;min-width:0}
  .doc-info .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary)}
  .doc-info .meta{font-size:11px;color:var(--text-quaternary)}
  .doc-info .st{font-size:11px}
  .st.ok{color:#16a34a}.st.fail{color:var(--danger)}.st.run{color:#d97706}
  .doc-more{opacity:0;color:var(--text-quaternary)}
  .doc-card:hover .doc-more{opacity:1}
  .upload-btn{width:100%;border:1px dashed var(--border-strong);border-radius:8px;padding:10px;color:var(--text-tertiary);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
  .upload-btn:hover{border-color:var(--accent);color:var(--accent)}
  .upload-hint{font-size:11px;color:var(--text-quaternary);margin-top:8px;text-align:center}
  .param-title{font-size:13px;font-weight:500;margin:16px 0 10px;color:var(--text-secondary)}
  .param-block{margin-bottom:14px}

<script>
const API='/api/v1';
window.onerror=function(msg,src,line,col,err){
  try{
    fetch(API+'/client-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:String(msg),src:String(src),line:line,col:col})});
  }catch(e){}
  return false;
};
let TOKEN=localStorage.getItem('_rag_tok')||'';
let KBS=[],DOCS=[],SESSIONS=[],KB=null,SESSION=null,STREAMING=false,DEEP=false,SEARCH=false,ACTIVE_STREAMS=new Map(),STREAM_KEY=0,conversations=new Map(),activeConversationId=null;
let ATTACHED=null,PLUS_MENU=null,MENU=null,lastMsgId=null,MULTI=false,MULTI_SEL={},SEL_DOC=null;

function h(k){return{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}}
async function api(path,opts={}){
  const o=Object.assign({headers:h(opts.form?{}:{'Content-Type':'application/json'})},opts);
  if(opts.body&&!opts.form)o.body=JSON.stringify(opts.body);
  const r=await fetch(API+path,o);const t=await r.text();
  try{return{ok:r.ok,data:JSON.parse(t)}}catch(e){return{ok:r.ok,data:t}}
}
function fmtErr(d){if(d==null)return'操作失败';if(typeof d==='string')return d;if(Array.isArray(d))return d.map(x=>x&&x.msg||'').filter(Boolean).join('；')||'参数不合法';return'操作失败'}
function cleanTex(s){s=s||'';s=s.replace(/\\(?:qquad|quad|hspace\*?\{[^}]*\}|textcircled\s*\{\s*=\s*\})[ \t]*/g,' ');s=s.replace(/\\&/g,' ');s=s.replace(/[ \t]*~+[ \t]*/g,' ');s=s.replace(/\\[ ,;!:]/g,'');s=s.replace(/[ \t]{2,}/g,' ');return s;}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function convKey(id){return'chat_history_'+id}
function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16)})}
function saveConv(conv){try{localStorage.setItem(convKey(conv.id),JSON.stringify({id:conv.id,kbId:conv.kbId,title:conv.title,messages:conv.messages}))}catch(e){}}
function renderMd(text,skipMath){
  try{
    const maths=[];
    const t=(text||'')
      .replace(/\$\$([\s\S]+?)\$\$/g,(m,la)=>{maths.push({la:(la||'').trim(),block:true});return'@@MATH'+(maths.length-1)+'@@'})
      .replace(/(?<!\$)\$(?!\$)([^$\n]+?)\$(?!\$)/g,(m,la)=>{maths.push({la:(la||'').trim(),block:false});return'@@MATH'+(maths.length-1)+'@@'});
    let html;
    try{html=window.marked?marked.parse(t):esc(t)}catch(e){html=esc(t)}
    if(window.DOMPurify)html=DOMPurify.sanitize(html);
    const fill=(m,i)=>{const it=maths[+i];if(!it)return'';if(skipMath||!window.katex)return `<span class="math-raw" data-latex="${encodeURIComponent(it.la)}">${it.block?('$$'+it.la+'$$'):('$'+it.la+'$')}</span>`;try{return katex.renderToString(it.la,{displayMode:it.block,throwOnError:false})}catch(e){return it.block?('$$'+it.la+'$$'):('$'+it.la+'$')}};
    html=html.replace(/@@MATH(\d+)@@/g,fill);
    return html;
  }catch(e){return esc(text)}
}
function rerenderMath(){if(!window.katex)return;document.querySelectorAll('.math-raw').forEach(el=>{const la=decodeURIComponent(el.getAttribute('data-latex')||'');if(la){try{el.outerHTML=katex.renderToString(la,{displayMode:true,throwOnError:false})}catch(e){}}})}
window.addEventListener('load',()=>setTimeout(rerenderMath,400));
function extractSources(text){
  const re=/\[来源:\s*([^,\]]+?),\s*第(\d+)页\]/g;
  const seen={},out=[];let m;
  while((m=re.exec(text||''))){const k=m[1].trim()+'|'+m[2];if(!seen[k]){seen[k]=1;out.push({doc:m[1].trim(),page:m[2]})}}
  return out;
}
function addSrcCard(body,sources){
  if(!sources||!sources.length)return;
  const sc=document.createElement('div');sc.className='src-card auto';
  const t=document.createElement('div');t.className='src-title';t.textContent='🔗 引用来源';
  const wrap=document.createElement('div');wrap.className='ref-wrap';
  sources.forEach((sp,i)=>{const el=document.createElement('span');el.className='ref-tag';el.dataset.idx=i;el.title='点击查看原文并定位';el.textContent=(i+1)+'. '+(sp.doc_name||sp.doc)+' · 第'+sp.page+'页';wrap.appendChild(el)});
  sc.appendChild(t);sc.appendChild(wrap);sc.onclick=(e)=>{const tag=(e.target&&e.target.closest)?e.target.closest('.ref-tag'):null;if(tag)showSource(sources[+tag.dataset.idx])};body.appendChild(sc);
}
let _srcReq=0;
async function showSource(sp){
  if(!sp){toast('来源不存在');return}
  const req=++_srcReq;
  const fn=sp.doc_name||sp.doc||'';
  const rp=document.getElementById('rightPanel');rp.classList.add('open');rp.classList.remove('closed');positionRpResize();
  document.querySelectorAll('#rightPanel .panel-section').forEach(el=>el.style.display='none');
  const ph=rp.querySelector('.panel-head');ph.querySelector('h3').textContent='原文预览';
  const retBtn=ph.querySelector('button');retBtn.textContent='‹ 返回';retBtn.title='返回文档列表';retBtn.style.whiteSpace='nowrap';retBtn.style.width='auto';retBtn.style.padding='0 8px';retBtn.style.fontSize='13px';retBtn.onclick=exitSourcePreview;
  const prev=document.getElementById('srcPrev');prev.classList.remove('hide');prev.innerHTML='<div class="preview-empty">加载中…</div>';
  const docId=sp.doc_id||(()=>{const d=DOCS.find(x=>x.filename===fn);return d?d.id:null})();
  const stripPref=function(s){s=s||'';if(s.indexOf('[文档概要]')!==0)return s;var k=s.indexOf(String.fromCharCode(10));return k<0?'':s.slice(k+1);};
  const frag=cleanTex(stripPref((sp.text||'').trim()));
  let pages=[];
  if(docId){try{const r=await api('/documents/'+docId+'/content');if(r.ok&&r.data&&r.data.pages)pages=r.data.pages}catch(e){}}
  if(req!==_srcReq)return;
  if(!pages.length&&(frag||sp.text))pages=[{page:sp.page||0,text:sp.text||''}];
  prev.innerHTML=(docId?`<div class="src-docbar"><span class="dn">${esc(fn)}</span><button onclick="downloadSrc('${docId}')">下载</button><button onclick="viewInLib('${docId}')">文档库查看</button></div>`:'')+pages.map(p=>`<div class="src-page" id="srcpg-${p.page}"><div class="src-pg-num">第 ${p.page} 页</div><div class="src-text">${esc(cleanTex(stripPref(p.text||'')))}</div></div>`).join('')||'<div class="preview-empty">暂无原文</div>';
  let targetPage=null, mkEl=null;
  if(frag){
    const nf=frag.replace(/\s+/g,'');
    for(const p of pages){
      const t=cleanTex(stripPref(p.text||''));let idx=t.indexOf(frag);
      if(idx<0){const nt=t.replace(/\s+/g,'');const pos=nt.indexOf(nf);if(pos>=0){let i=0,c=0;while(c<pos&&i<t.length){if(!/\s/.test(t[i]))c++;i++;}idx=i;}}
      if(idx>=0){targetPage=p.page;const el=document.getElementById('srcpg-'+p.page);const txt=el?el.querySelector('.src-text'):null;if(txt){txt.innerHTML=esc(t.slice(0,idx))+'<mark class="src-flash">'+esc(t.slice(idx,idx+frag.length))+'</mark>'+esc(t.slice(idx+frag.length));mkEl=txt.querySelector('.src-flash');}break}
    }
  } else if(pages.some(p=>String(p.page)===String(sp.page))){targetPage=sp.page}
  if(targetPage==null&&pages.some(p=>String(p.page)===String(sp.page))){targetPage=sp.page}
  if(req===_srcReq){const rp=document.getElementById('rightPanel');if(mkEl){rp.scrollTop+=(mkEl.getBoundingClientRect().top-rp.getBoundingClientRect().top-8);}else if(targetPage!=null){const el=document.getElementById('srcpg-'+targetPage);if(el){rp.scrollTop+=(el.getBoundingClientRect().top-rp.getBoundingClientRect().top-8);}}}
}
async function downloadSrc(id){if(!id){toast('无文档');return}try{const r=await fetch(`${API}/documents/${id}/file`,{headers:{'Authorization':'Bearer '+TOKEN}});if(!r.ok){toast('下载失败');return}const b=await r.blob();const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='';a.click();URL.revokeObjectURL(url);}catch(e){toast('下载失败')}}
function viewInLib(id){if(!id)return;const rp=document.getElementById('rightPanel');rp.classList.remove('open');rp.classList.add('closed');openDocLib();if(id)previewDoc(id);}
function exitSourcePreview(){
  const rp=document.getElementById('rightPanel');
  document.querySelectorAll('#rightPanel .panel-section').forEach(el=>el.style.display='');
  const ph=rp.querySelector('.panel-head');ph.querySelector('h3').textContent='文档管理';
  const retBtn=ph.querySelector('button');retBtn.textContent='›';retBtn.title='收起';retBtn.style.whiteSpace='';retBtn.style.width='';retBtn.style.padding='';retBtn.style.fontSize='';retBtn.onclick=()=>togglePanel(false);
  document.getElementById('srcPrev').classList.add('hide');
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function relTime(iso){if(!iso)return'';const t=new Date(iso),now=new Date(),diff=(now-t)/1000;if(diff<60)return'刚刚';if(diff<3600)return Math.floor(diff/60)+'分钟前';if(diff<86400)return Math.floor(diff/3600)+'小时前';if(diff<7*86400)return Math.floor(diff/86400)+'天前';return t.toLocaleDateString()}
function groupKey(iso){const t=new Date(iso),now=new Date();const d=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());const days=Math.floor((d(now)-d(t))/86400000);if(days===0)return'今天';if(days===1)return'昨天';if(days<7)return'过去7天';return'更早'}

/* 自定义滑块 */
function initSliders(){
  document.querySelectorAll('.slider').forEach(sl=>{
    const min=+sl.dataset.min,max=+sl.dataset.max,step=+sl.dataset.step;
    let val=+sl.dataset.val;
    const fill=document.createElement('div');fill.className='slider-fill';
    const thumb=document.createElement('div');thumb.className='slider-thumb';
    sl.appendChild(fill);sl.appendChild(thumb);
    const tgt=document.getElementById(sl.dataset.target);
    function paint(){const p=(val-min)/(max-min);fill.style.width=p*100+'%';thumb.style.left=p*100+'%';tgt.textContent=val}
    function setFromEvent(e){const r=sl.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));val=Math.round((min+p*(max-min))/step)*step;val=Math.max(min,Math.min(max,val));paint()}
    sl.addEventListener('mousedown',e=>{setFromEvent(e);const mv=ev=>setFromEvent(ev),up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
    paint();
  });
}

function startRename(){
  const titleEl=document.getElementById('chatTitle');if(!SESSION)return;
  const old=titleEl.textContent;
  const input=document.createElement('input');input.className='rename-input';input.value=old;
  titleEl.replaceWith(input);input.focus();input.select();
  let done=false;
  function finish(v){
    if(done)return;done=true;
    const span=document.createElement('span');span.id='chatTitle';span.className='title';span.textContent=v||old;span.title='点击重命名';span.onclick=startRename;
    input.replaceWith(span);
  }
  input.onkeydown=e=>{if(e.key==='Enter'){const v=input.value.trim();if(v){api('/chat/sessions/'+SESSION,{method:'PATCH',body:{title:v}}).then(r=>{if(r.ok)loadSessions()});finish(v)}else finish(old)}if(e.key==='Escape')finish(old)};
  input.onblur=()=>{const v=input.value.trim();if(v&&v!==old){api('/chat/sessions/'+SESSION,{method:'PATCH',body:{title:v}}).then(r=>{if(r.ok)loadSessions()});finish(v)}else finish(old)};

async function ask(forceQ, skipUser){
  const q=(forceQ!==undefined&&forceQ!==null&&String(forceQ).trim())?String(forceQ).trim():document.getElementById('question').value.trim();
  if(!q||!KB)return;
  let conv=conversations.get(activeConversationId);
  if(!conv||conv.kbId!==KB.id){const id=newConv();conv=conversations.get(id);activeConversationId=id;SESSION=id;localStorage.setItem('_rag_active_conv',id)}
  if(conv.isStreaming){toast('当前对话正在回复，请先停止或稍候再提问');return}
  if(!conv.title){conv.title=q.slice(0,20);document.getElementById('chatTitle').textContent=conv.title}
  let aiIdx;
  if(skipUser){aiIdx=conv.messages.length-1;if(!(conv.messages[aiIdx]&&conv.messages[aiIdx].role==='assistant')){conv.messages.push({role:'assistant',content:'',sources:[]});aiIdx=conv.messages.length-1;}conv.messages[aiIdx].content='';conv.messages[aiIdx].sources=[];}
  else{conv.messages.push({role:'user',content:q});document.getElementById('question').value='';autoGrow(document.getElementById('question'));aiIdx=conv.messages.length;conv.messages.push({role:'assistant',content:'',sources:[]});}
  conv.messages[aiIdx]._partial=true;
  saveConv(conv);
  renderChat();renderSessions();
  const ctrl=new AbortController();conv.ctrl=ctrl;conv.isStreaming=true;conv.currentStreamText='';conv.lastSources=[];
  updateStopBtn();
  const cid=conv.id;localStorage.setItem('_rag_active_conv',cid);
  try{
    const resp=await fetch(`${API}/chat/stream`,{method:'POST',headers:h({}),body:JSON.stringify({kb_id:KB.id,question:q,session_id:cid,stream:true}),signal:ctrl.signal});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(payload==='[DONE]')continue;try{const ev=JSON.parse(payload);if(ev.type==='sources'){conv.lastSources=ev.data;loadSessions()}else if(ev.type==='delta'){conv.currentStreamText+=ev.text;if(activeConversationId===cid)updateAiDOM(cid,aiIdx,conv.currentStreamText);var _n=Date.now();if(!conv._saveT||_n-conv._saveT>500){conv._saveT=_n;conv.messages[aiIdx].content=conv.currentStreamText;conv.messages[aiIdx]._partial=true;saveConv(conv);}}else if(ev.type==='done'){lastMsgId=ev.message_id}}catch(e){}}}
  }catch(e){ conv._failed=true; }
  finally{
    conv.messages[aiIdx].content=conv.currentStreamText||(conv._failed?'⚠️ 网络错误或请求中断':'');
    conv.messages[aiIdx]._partial=false;
    conv._failed=false;
    conv.messages[aiIdx].sources=conv.lastSources||[];
    conv.ctrl=null;conv.isStreaming=false;
    saveConv(conv);
    if(activeConversationId===cid)renderChat();
    updateStopBtn();autoGrow(document.getElementById('question'));
  }
}

function updateStopBtn(){const b=document.getElementById('stopBtn');if(b){const any=[...conversations.values()].some(c=>c.isStreaming);b.style.display=any?'inline-flex':'none'}}
function stopCurrent(){const conv=conversations.get(activeConversationId);if(conv&&conv.ctrl){conv.ctrl.abort()}else{const last=[...conversations.values()].reverse().find(c=>c.isStreaming&&c.ctrl);if(last)last.ctrl.abort()}}

function finalize(div,answer,sources){
  const body=div.querySelector('.ai-body');
  const think=document.createElement('div');think.className='thinking-panel';
  think.innerHTML=`<div class="thinking-head"><span class="arrow">›</span>已深度思考 · 检索 ${sources&&sources.length?sources.length:0} 个相关片段</div><div class="thinking-body hide">通过混合检索（向量 + BM25 + 重排）定位到 ${sources&&sources.length?sources.length:0} 个文档片段作为本次回答的参考资料。</div>`;
  think.querySelector('.thinking-head').onclick=()=>{think.querySelector('.thinking-head').classList.toggle('open');think.querySelector('.thinking-body').classList.toggle('hide')};
  const auto=body.querySelector('.src-card.auto');if(auto)auto.remove();
  body.innerHTML=renderMd(answer);
  body.prepend(think);
  if(sources&&sources.length){
    const sc=document.createElement('div');sc.className='src-card';
    const wt=document.createElement('div');wt.className='src-title';wt.textContent='🔗 引用来源';
    const wr=document.createElement('div');wr.className='ref-wrap';
    sources.forEach((sp,i)=>{const el=document.createElement('span');el.className='ref-tag';el.dataset.idx=i;el.title='点击查看原文并定位';el.textContent=(i+1)+'. '+(sp.doc_name||sp.doc)+' · 第'+sp.page+'页';wr.appendChild(el)});
    sc.appendChild(wt);sc.appendChild(wr);sc.onclick=(e)=>{const tag=(e.target&&e.target.closest)?e.target.closest('.ref-tag'):null;if(tag)showSource(sources[+tag.dataset.idx])};
    body.appendChild(sc);
  }
  loadSessions();
}
async function regenerate(){const conv=conversations.get(activeConversationId);if(!conv)return;var users=conv.messages.filter(function(m){return m.role==='user'});var q=users.length?users[users.length-1].content:'';if(!q){toast('没有可重新生成的问题');return}conv.isStreaming=false;saveConv(conv);renderChat();ask(q, true)}

/* 文档上传 */
function fmtSize(b){b=+b||0;if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(1)+'KB';if(b<1073741824)return (b/1048576).toFixed(1)+'MB';return (b/1073741824).toFixed(1)+'GB'}
function openDocLib(){
  document.getElementById('docView').style.display='flex';document.getElementById('chatBox').style.display='none';document.querySelector('.input-area').style.display='none';document.getElementById('rightPanel').style.display='none';
  document.getElementById('docLibTitle').textContent=KB?('文档库 · '+KB.name):'文档库';
  loadDocs().then(()=>{renderDocList();document.getElementById('docPreview').innerHTML='<div class="preview-empty">双击左侧文档以预览</div>'});
}
function closeDocLib(){
  document.getElementById('docView').style.display='none';document.getElementById('chatBox').style.display='';document.querySelector('.input-area').style.display='';document.getElementById('rightPanel').style.display='';
  document.getElementById('docPreview').innerHTML='<div class="preview-empty">双击左侧文档以预览</div>';
}
function renderDocList(){
  const kw=(document.getElementById('docSearch').value||'').trim();
  const box=document.getElementById('docList');
  const list=DOCS.filter(d=>!kw||(d.filename||'').toLowerCase().includes(kw.toLowerCase()));
  document.getElementById('docCount').textContent='共 '+DOCS.length+' 篇';
  box.innerHTML=list.map(d=>{const st=d.status==='indexed'?'<span class="st ok">✓ 已解析</span>':d.status==='failed'?'<span class="st fail">✗ 失败</span>':'<span class="st run">… '+(d.progress||0)+'%</span>';
    return `<div class="doc-item ${SEL_DOC===d.id?'selected':''}" onclick="selectDoc('${d.id}')" ondblclick="previewDoc('${d.id}')"><div class="doc-nm">${esc(d.filename)}</div><div class="doc-meta"><span>${d.page_count||'?'}页 · ${fmtSize(d.size)} · ${relTime(d.created_at)||''}</span>${st}<span class="doc-actions"><span class="doc-del" title="重命名" onclick="event.stopPropagation();renameDoc('${d.id}')">✏️</span><span class="doc-del" title="删除" onclick="event.stopPropagation();deleteDoc('${d.id}')">🗑</span></span></div></div>`;
  }).join('')||'<div class="preview-empty">暂无文档</div>';
}
function selectDoc(id){SEL_DOC=id;renderDocList()}
function closePreview(){document.getElementById('docPreview').innerHTML='<div class="preview-empty">双击左侧文档以预览</div>'}
async function previewDoc(id){
  const d=DOCS.find(x=>x.id===id);if(!d){toast('文档不存在');return}
  const pv=document.getElementById('docPreview');
  if(d.status==='processing'){pv.innerHTML='<div class="preview-empty">文档处理中，请稍后再试…</div>';return}
  if(d.status!=='indexed'){pv.innerHTML='<div class="preview-empty">文档未解析，无法预览</div>';return}
  const ext=(d.filename||'').split('.').pop().toLowerCase();
  pv.innerHTML='<div class="preview-empty">加载中…</div>';
  try{
    const r=await fetch(`${API}/documents/${id}/file`,{headers:{'Authorization':'Bearer '+TOKEN}});
    if(!r.ok){pv.innerHTML='<div class="preview-empty">加载失败('+r.status+')</div>';return}
    const blob=await r.blob();const url=URL.createObjectURL(blob);
    const head=`<div class="pv-head"><span>${esc(d.filename)}</span><a class="pv-dl" href="${url}" target="_blank" download>下载</a><button class="btn-cancel" onclick="closePreview()">关闭</button></div>`;
    const body=(ext==='pdf')?`<iframe class="pv-frame" src="${url}"></iframe>`:'<div class="preview-empty">该格式暂无在线预览，请下载查看</div>';
    pv.innerHTML=head+body;
  }catch(e){pv.innerHTML='<div class="preview-empty">加载失败</div>'}
}
function pickFile(){document.getElementById('fileIn').click()}
async function doUpload(input){const file=input.files[0];input.value='';if(!file)return;if(!KB){toast('请先创建/选择知识库');return}const dup=DOCS.find(d=>d.filename===file.name);let overwrite=false;if(dup){if(!confirm('已有同名文档「'+file.name+'」\n【确定】=覆盖重传'))return;overwrite=true}const fd=new FormData();fd.append('file',file);const r=await fetch(`${API}/documents?kb_id=${KB.id}&overwrite=${overwrite}`,{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});const d=await r.json();if(d.status==='indexed'){toast('已入库 '+d.filename);loadDocs()}else if(d.status==='processing'||d.status==='pending'){loadDocs();pollDoc(d.id)}else if(d.error)toast('处理失败：'+d.error)}
function pollDoc(id){const t=setInterval(async()=>{await loadDocs();const doc=DOCS.find(x=>x.id===id);if(!doc||doc.status==='indexed'||doc.status==='failed'){clearInterval(t);if(doc&&doc.status==='indexed')toast('已入库 '+doc.filename);if(doc&&doc.status==='failed')toast('处理失败')}},2000)}
function docIcon(name){const e=(name||'').split('.').pop().toLowerCase();if(e==='pdf')return['pdf','📕'];if(e==='docx'||e==='doc')return['docx','📘'];if(e==='xlsx'||e==='xls'||e==='csv')return['xlsx','📗'];return['txt','📄']}
async function loadDocs(){if(!KB)return;const r=await api('/documents?kb_id='+KB.id);const arr=r.data||[];const seen={};DOCS=[];for(const d of arr){if(!seen[d.filename]){seen[d.filename]=true;DOCS.push(d)}}const box=document.getElementById('docsBox');box.innerHTML=DOCS.map(d=>{const[cls,ic]=docIcon(d.filename);const st=d.status==='indexed'?`<span class="st ok">✓</span>`:d.status==='failed'?`<span class="st fail">✗</span>`:`<span class="st run">…${d.progress||0}%</span>`;return`<div class="doc-card"><div class="doc-icon ${cls}">${ic}</div><div class="doc-info"><div class="nm" title="${esc(d.filename)}">${esc(d.filename)}</div><div class="meta">${d.page_count||'?'}页 · ${st}</div></div><span class="doc-more" onclick="deleteDoc('${d.id}')">🗑</span></div>`}).join('')||'<div class="upload-hint">暂无文档</div>'}
async function renameDoc(id){const d=DOCS.find(x=>x.id===id);if(!d)return;const name=(prompt('重命名文档',d.filename)||'').trim();if(!name||name===d.filename)return;const r=await api('/documents/'+id,{method:'PATCH',body:{filename:name}});if(r.ok){toast('已重命名');await loadDocs();renderDocList()}else toast('重命名失败：'+((r.data&&r.data.detail)||''))}
async function deleteDoc(id){if(!confirm('确定删除该文档？'))return;const r=await api('/documents/'+id,{method:'DELETE'});if(r.ok){await loadDocs();renderDocList()}else toast('删除失败')}

/* "+" 菜单（向上弹出 + 子菜单） */
function closePlus(){if(PLUS_MENU){PLUS_MENU.remove();PLUS_MENU=null}}
function togglePlusMenu(){
  if(PLUS_MENU){closePlus();return}
  const b=document.getElementById('plusBtn');const r=b.getBoundingClientRect();
  const m=document.createElement('div');m.className='menu';
  m.style.bottom=(window.innerHeight-r.top+6)+'px';m.style.left=Math.max(8,r.left)+'px';
  m.innerHTML=`<div class="menu-item">📎 文件和图片 <span style="margin-left:auto">›</span><div class="submenu"><div class="menu-item" onclick="pickFile();closePlus()">⬆ 上传本地文件</div><div class="menu-item" onclick="togglePanel(true);closePlus()">📚 从文档库选择</div></div></div><div class="menu-item" onclick="toggleSearch();closePlus()">🌐 联网搜索</div><div class="menu-item" onclick="closePlus()">× 关闭</div>`;
  document.body.appendChild(m);PLUS_MENU=m;
}
document.addEventListener('click',e=>{
  if(PLUS_MENU&&!e.target.closest('.menu')&&e.target.id!=='plusBtn')closePlus();
  if(MENU&&!e.target.closest('.sess-menu'))closeMenus();
});

init();
