<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能文档问答</title>
<script src="https://cdn.bootcdn.net/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root{
    --primary:#1677ff; --primary-hover:#3c89ff; --primary-weak:#e6f0ff;
    --bg:#ffffff; --sidebar-bg:#fafafa; --panel-bg:#ffffff;
    --msg-ai-bg:#f5f5f5; --msg-user-bg:#1677ff;
    --text:#1f1f1f; --text-2:#262626; --text-3:#8c8c8c; --text-4:#595959;
    --border:#f0f0f0; --border-2:#e5e7eb;
    --card-shadow:0 2px 8px rgba(0,0,0,.08);
    --hover-shadow:0 4px 16px rgba(0,0,0,.12);
    --radius-card:12px; --radius-btn:8px; --radius-bubble:16px;
    --green:#16a34a; --red:#ef4444; --amber:#f59e0b;
  }
  [data-theme="dark"]{
    --primary:#1668dc; --primary-hover:#3c89ff; --primary-weak:#16283f;
    --bg:#0d0d0d; --sidebar-bg:#141414; --panel-bg:#171717;
    --msg-ai-bg:#262626; --msg-user-bg:#1668dc;
    --text:#e0e0e0; --text-2:#d9d9d9; --text-3:#595959; --text-4:#8c8c8c;
    --border:#303030; --border-2:#3a3a3a;
    --card-shadow:0 2px 8px rgba(0,0,0,.4);
    --hover-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s ease-in-out,color .2s ease-in-out}
  button{font-size:14px;cursor:pointer;border:none;border-radius:var(--radius-btn);transition:background .2s ease-in-out,box-shadow .2s ease-in-out,opacity .2s}
  input,select,textarea{font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border-2);border-radius:8px;padding:8px 12px;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--primary)}
  .hide{display:none!important}
  .ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:6px 12px}
  .ghost:hover{background:var(--primary-weak)}
  .primary{background:var(--primary);color:#fff;padding:8px 16px}
  .primary:hover{background:var(--primary-hover)}
  .primary:disabled{opacity:.5;cursor:not-allowed}
  .mini{font-size:12px;padding:3px 8px;border-radius:6px;background:transparent;color:var(--text-3);border:1px solid transparent}
  .mini:hover{background:var(--border);color:var(--text)}

  /* ===== 登录 ===== */
  #loginCard{max-width:420px;margin:12vh auto;padding:32px;background:var(--panel-bg);border-radius:var(--radius-card);box-shadow:var(--card-shadow)}
  #loginCard h1{font-size:22px;margin-bottom:4px}
  #loginCard .sub{color:var(--text-3);font-size:13px;margin-bottom:20px}
  #loginCard input{width:100%;margin-bottom:12px}
  .login-row{display:flex;gap:8px}
  #loginMsg{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}

  /* ===== 三栏布局 ===== */
  .app{display:flex;height:100vh;overflow:hidden}

  /* 左侧边栏 */
  .sidebar{width:260px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s}
  .side-top{padding:14px;border-bottom:1px solid var(--border)}
  #newChatBtn{width:100%;background:var(--primary);color:#fff;padding:10px;border-radius:12px;font-size:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px}
  #newChatBtn:hover{background:var(--primary-hover)}
  #kbSel{width:100%;margin-bottom:6px}
  .side-search input{width:100%}
  .session-list{flex:1;overflow-y:auto;padding:8px}
  .sess-group-title{font-size:12px;color:var(--text-3);padding:10px 10px 4px}
  .sess-item{padding:10px;border-radius:10px;cursor:pointer;border-left:3px solid transparent;margin-bottom:2px;transition:background .2s,border-color .2s}
  .sess-item:hover{background:var(--border)}
  .sess-item.active{background:var(--primary-weak);border-left-color:var(--primary)}
  .sess-item .t{font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess-item .p{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .sess-item .tm{font-size:11px;color:var(--text-4);margin-top:2px}
  .side-bottom{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .user-chip{display:flex;align-items:center;gap:8px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .side-empty{padding:30px 16px;text-align:center;color:var(--text-3);font-size:13px}

  /* 中央对话 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .chat-top{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg)}
  .chat-top .title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kb-tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--primary-weak);color:var(--primary)}
  .chat-top .spacer{flex:1}
  .chat-top select{width:auto;padding:5px 10px;font-size:13px}
  .chat-top .icon-btn{background:transparent;color:var(--text-3);padding:6px;border-radius:8px}
  .chat-top .icon-btn:hover{background:var(--border);color:var(--text)}

  #chatBox{flex:1;overflow-y:auto;padding:20px 24px}
  .msg{display:flex;margin-bottom:16px;animation:msgIn .3s ease-out}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{justify-content:flex-end}
  .msg.ai{justify-content:flex-start}
  .bubble{max-width:78%;padding:12px 16px;font-size:15px;line-height:1.6;border-radius:16px;word-break:break-word}
  .msg.user .bubble{background:var(--msg-user-bg);color:#fff;border-radius:16px 4px 16px 16px}
  .msg.ai .bubble{background:var(--msg-ai-bg);color:var(--text-2);border-radius:4px 16px 16px 16px}
  .bubble table{border-collapse:collapse;margin:6px 0;width:100%;font-size:13px}
  .bubble th,.bubble td{border:1px solid var(--border-2);padding:4px 8px;text-align:left}
  .bubble th{background:var(--primary-weak)}
  .bubble code{background:var(--primary-weak);padding:1px 4px;border-radius:4px;font-size:12px;font-family:"JetBrains Mono",Consolas,monospace}
  .bubble pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0}
  .bubble pre code{background:none;color:inherit;padding:0}
  .msg-actions{margin-top:6px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
  .msg:hover .msg-actions{opacity:1}
  .src{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.5}
  .src b{color:var(--primary)}
  .thinking{font-size:13px;color:var(--text-4);font-style:italic;background:var(--border);border-radius:8px;padding:8px 12px;margin-bottom:8px}
  .typing-cursor{display:inline-block;width:2px;height:15px;background:var(--text-3);vertical-align:middle;animation:blink 1s infinite;margin-left:2px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* 输入区 */
  .input-area{border-top:1px solid var(--border);padding:12px 24px 16px;background:var(--bg)}
  .suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .sugg{background:var(--msg-ai-bg);color:var(--text-2);border:1px solid var(--border);padding:8px 12px;border-radius:10px;font-size:13px}
  .sugg:hover{border-color:var(--primary);color:var(--primary)}
  .input-box{display:flex;align-items:flex-end;gap:8px;background:var(--msg-ai-bg);border:1px solid var(--border-2);border-radius:16px;padding:8px}
  .input-box:focus-within{border-color:var(--primary)}
  textarea#question{flex:1;border:none;background:transparent;resize:none;max-height:144px;padding:6px 4px;font-size:15px;line-height:1.5}
  textarea#question:focus{border:none;box-shadow:none}
  .input-btns{display:flex;align-items:center;gap:4px}
  .input-btns button{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
  #sendBtn{background:var(--primary);color:#fff}
  #sendBtn:disabled{background:var(--border-2);color:var(--text-3);cursor:not-allowed}
  #uploadBtn{background:transparent;color:var(--text-3)}
  #uploadBtn:hover{background:var(--border)}

  /* 右侧面板 */
  .right-panel{width:320px;flex-shrink:0;background:var(--panel-bg);border-left:1px solid var(--border);overflow-y:auto;transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s}
  .panel-section{padding:16px;border-bottom:1px solid var(--border)}
  .panel-section h3{font-size:14px;margin-bottom:12px;color:var(--text-2);display:flex;justify-content:space-between;align-items:center}
  .doc-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .doc-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbar{display:inline-block;width:50px;height:5px;background:var(--border-2);border-radius:3px;overflow:hidden;vertical-align:middle;margin:0 4px}
  .pbar>i{display:block;height:100%;background:var(--primary);width:0%;transition:width .3s}
  .st{font-size:12px}
  .st.ok{color:var(--green)} .st.fail{color:var(--red)} .st.run{color:var(--amber)}
  .param{margin-bottom:10px}
  .param label{font-size:12px;color:var(--text-3);display:flex;justify-content:space-between}
  .param input[type=range]{width:100%;margin-top:4px;accent-color:var(--primary)}
  .upload-hint{font-size:12px;color:var(--text-3);margin-top:8px}
  #fileIn{display:none}

  /* 抽屉遮罩（移动端） */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .mask.show{display:block}
  .hamburger{display:none}

  /* Toast */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:14px;z-index:200;box-shadow:var(--hover-shadow);animation:msgIn .3s}

  /* 响应式 */
  @media (max-width:1439px){ .right-panel{position:fixed;right:0;top:0;bottom:0;z-index:60;transform:translateX(100%);box-shadow:var(--hover-shadow)} .right-panel.open{transform:translateX(0)} }
  @media (max-width:1023px){ .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-100%);box-shadow:var(--hover-shadow)} .sidebar.open{transform:translateX(0)} .hamburger{display:inline-flex} }
  @media (max-width:767px){ .bubble{max-width:92%} #chatBox{padding:12px} .chat-top .model-sel{display:none} }
</style>
</head>
<body>
<!-- 登录 -->
<div id="loginCard">
  <h1>企业智能文档问答</h1>
  <div class="sub">私有化 RAG · 带引用溯源 · 局域网演示版</div>
  <input id="u" placeholder="用户名">
  <input id="p" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
  <div class="login-row">
    <button class="primary" style="flex:1" onclick="login()">登录</button>
    <button class="ghost" style="flex:1" onclick="register()">注册</button>
  </div>
  <div id="loginMsg"></div>
</div>

<!-- 主应用 -->
<div id="appCard" class="app hide">
  <div class="mask" id="mask" onclick="toggleSidebar(false)"></div>

  <!-- 左侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <button id="newChatBtn" onclick="newChat()">＋ 新建对话</button>
      <select id="kbSel" onchange="selectKb()"></select>
      <div class="side-search" style="margin-top:6px"><input id="sessionSearch" placeholder="搜索历史对话…" oninput="renderSessions()"></div>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="side-bottom">
      <div class="user-chip"><div class="avatar" id="userAvatar">用</div><span id="userRole" style="font-size:13px">用户</span></div>
      <button class="mini" id="themeBtn" onclick="toggleTheme()">🌙 深色</button>
    </div>
  </aside>

  <!-- 中央对话区 -->
  <main class="main">
    <header class="chat-top">
      <button class="icon-btn hamburger" onclick="toggleSidebar(true)">☰</button>
      <span class="title" id="chatTitle">新对话</span>
      <span class="kb-tag" id="kbTag"></span>
      <div class="spacer"></div>
      <select id="modelSel" class="model-sel" title="模型">
        <option>qwen-plus</option><option>deepseek-chat</option><option>演示模式</option>
      </select>
      <button class="icon-btn" id="panelToggle" onclick="togglePanel()" title="右侧面板">⚙</button>
      <button class="icon-btn" onclick="clearChat()" title="清空当前对话">🗑</button>
    </header>
    <div id="chatBox"></div>
    <div class="input-area">
      <div class="suggestions" id="suggestions"></div>
      <div class="input-box">
        <textarea id="question" rows="1" placeholder="基于企业知识库提问…（Shift+Enter 换行）" oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
        <div class="input-btns">
          <button id="uploadBtn" onclick="pickFile()" title="上传文档">📎</button>
          <button id="sendBtn" onclick="ask()" disabled>↑</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 右侧面板 -->
  <aside class="right-panel" id="rightPanel">
    <div class="panel-section">
      <h3>文档管理 <button class="mini" onclick="pickFile()">＋ 上传</button></h3>
      <div id="docsBox"></div>
      <div class="upload-hint">支持 PDF / Word / Excel / PPT / TXT</div>
    </div>
    <div class="panel-section">
      <h3>模型参数</h3>
      <div class="param"><label>温度 <span id="tempVal">0.7</span></label><input type="range" min="0" max="1" step="0.1" value="0.7" oninput="tempVal.textContent=this.value"></div>
      <div class="param"><label>Top-P <span id="toppVal">0.9</span></label><input type="range" min="0" max="1" step="0.05" value="0.9" oninput="toppVal.textContent=this.value"></div>
      <div class="param"><label>最大 Token <span id="maxTokVal">2048</span></label><input type="range" min="512" max="4096" step="256" value="2048" oninput="maxTokVal.textContent=this.value"></div>
    </div>
  </aside>
</div>

<input type="file" id="fileIn" onchange="doUpload(this)">
<script>
const API='/api/v1';
let TOKEN=localStorage.getItem('_rag_tok')||'';
let KBS=[],DOCS=[],SESSIONS=[],KB=null,SESSION=null,STREAMING=false;

function h(k){return{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}}
async function api(path,opts={}){
  const o=Object.assign({headers:h(opts.form?{}:{'Content-Type':'application/json'})},opts);
  if(opts.body&&!opts.form)o.body=JSON.stringify(opts.body);
  const r=await fetch(API+path,o);const t=await r.text();
  try{return{ok:r.ok,data:JSON.parse(t)}}catch(e){return{ok:r.ok,data:t}}
}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sessKey(){return'_rag_sess_'+(KB?KB.id:'x')}
function renderMd(text){
  try{if(window.marked&&window.DOMPurify)return DOMPurify.sanitize(marked.parse(text));return esc(text)}
  catch(e){return esc(text)}
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function relTime(iso){
  if(!iso)return '';
  const t=new Date(iso),now=new Date(),diff=(now-t)/1000;
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+'分钟前';
  if(diff<86400)return Math.floor(diff/3600)+'小时前';
  if(diff<7*86400)return Math.floor(diff/86400)+'天前';
  return t.toLocaleDateString();
}
function groupKey(iso){
  const t=new Date(iso),now=new Date();
  const d=(x)=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const days=Math.floor((d(now)-d(t))/86400000);
  if(days===0)return'今天';if(days===1)return'昨天';if(days<7)return'过去7天';return'更早';
}

/* ===== 主题 ===== */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('_rag_theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'☀ 浅色':'🌙 深色';
}
function initTheme(){const t=localStorage.getItem('_rag_theme')||'light';document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀ 浅色':'🌙 深色'}

/* ===== 布局 ===== */
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('mask').classList.toggle('show',open)}
function togglePanel(){document.getElementById('rightPanel').classList.toggle('open')}

/* ===== 认证 ===== */
async function init(){initTheme();if(!TOKEN)return;showApp()}
function clearAuth(){TOKEN='';localStorage.removeItem('_rag_tok');document.getElementById('appCard').classList.add('hide');document.getElementById('loginCard').classList.remove('hide')}
function showApp(){document.getElementById('loginCard').classList.add('hide');document.getElementById('appCard').classList.remove('hide');document.getElementById('userAvatar').textContent=(localStorage.getItem('_rag_user')||'用').slice(0,1);loadKbs()}
async function login(){
  const u=document.getElementById('u'),p=document.getElementById('p');
  const r=await api('/auth/login',{method:'POST',body:{username:u.value,password:p.value}});
  if(r.ok){TOKEN=r.data.access_token;localStorage.setItem('_rag_tok',TOKEN);localStorage.setItem('_rag_user',r.data.username||u.value);document.getElementById('userRole').textContent=r.data.role;showApp()}
  else document.getElementById('loginMsg').textContent=r.data.detail||'登录失败';
}
async function register(){
  const r=await api('/auth/register',{method:'POST',body:{username:document.getElementById('u').value,password:document.getElementById('p').value}});
  document.getElementById('loginMsg').textContent=r.ok?'注册成功，请登录':(r.data.detail||'注册失败');
}

/* ===== 知识库 ===== */
async function loadKbs(){
  const r=await api('/knowledge');
  if(!r.ok){clearAuth();document.getElementById('loginMsg').textContent='登录已过期';return}
  KBS=r.data;
  const sel=document.getElementById('kbSel');
  sel.innerHTML=KBS.map(k=>`<option value="${k.id}">${esc(k.name)} (${k.doc_count})</option>`).join('');
  const curId=KB?KB.id:(KBS[0]?KBS[0].id:null);
  if(curId){sel.value=curId;KB=KBS.find(k=>k.id===curId)||KBS[0]||null}
  document.getElementById('kbTag').textContent=KB?KB.name:'';
  if(KB){loadDocs();loadSessions();loadHistory()}else{document.getElementById('chatBox').innerHTML='';document.getElementById('docsBox').innerHTML=''}
}
function selectKb(){
  const sel=document.getElementById('kbSel');
  KB=KBS.find(k=>k.id===sel.value)||null;
  document.getElementById('kbTag').textContent=KB?KB.name:'';
  if(KB){loadDocs();loadSessions();loadHistory()}else{document.getElementById('chatBox').innerHTML='';document.getElementById('docsBox').innerHTML=''}
}
async function createKb(){
  const name=prompt('知识库名称','我的资料库');if(!name)return;
  const r=await api('/knowledge',{method:'POST',body:{name,description:''}});
  if(r.ok)await loadKbs();else toast('创建失败');
}

/* ===== 会话历史 ===== */
async function loadSessions(){
  if(!KB)return;
  const r=await api('/chat/sessions?kb_id='+KB.id);
  SESSIONS=r.ok&&r.data?r.data:[];
  renderSessions();
}
function renderSessions(){
  const box=document.getElementById('sessionList');
  const kw=(document.getElementById('sessionSearch').value||'').trim();
  let list=SESSIONS.filter(s=>!kw||s.title.includes(kw)||s.last_preview.includes(kw));
  const groups={};
  for(const s of list){const g=groupKey(s.created_at);(groups[g]=groups[g]||[]).push(s)}
  const order=['今天','昨天','过去7天','更早'];
  let html='';
  for(const g of order){if(!groups[g]||!groups[g].length)continue;
    html+=`<div class="sess-group-title">${g}</div>`;
    for(const s of groups[g]){
      html+=`<div class="sess-item ${s.id===SESSION?'active':''}" onclick="openSession('${s.id}')">
        <div class="t">${esc(s.title)}</div>
        <div class="p">${esc(s.last_preview)}</div>
        <div class="tm">${relTime(s.created_at)} · ${s.message_count}条</div>
      </div>`}
  }
  box.innerHTML=html||'<div class="side-empty">开始你的第一次文档问答</div>';
}
async function openSession(id){
  const r=await api('/chat/sessions/'+id);
  if(!r.ok)return;
  SESSION=id;localStorage.setItem(sessKey(),SESSION);
  document.getElementById('chatTitle').textContent=r.data.title||'对话';
  const box=document.getElementById('chatBox');box.innerHTML='';
  for(const m of r.data.messages)addMsg(m.role==='user'?'user':'ai',m.content);
  box.scrollTop=box.scrollHeight;renderSessions();
  if(window.innerWidth<1024)toggleSidebar(false);
}
function newChat(){
  SESSION=null;localStorage.removeItem(sessKey());
  document.getElementById('chatTitle').textContent='新对话';
  document.getElementById('chatBox').innerHTML='';
  document.getElementById('question').value='';autoGrow(document.getElementById('question'));
  showSuggestions();
  renderSessions();
  document.getElementById('question').focus();
  if(window.innerWidth<1024)toggleSidebar(false);
}
async function loadHistory(){
  const box=document.getElementById('chatBox');box.innerHTML='';
  if(!KB){SESSION=null;return}
  SESSION=localStorage.getItem(sessKey())||null;
  const r=await api('/chat/history?kb_id='+KB.id);
  if(!r.ok||!r.data)return;
  if(r.data.session_id){SESSION=r.data.session_id;localStorage.setItem(sessKey(),SESSION);document.getElementById('chatTitle').textContent='对话'}
  for(const m of(r.data.messages||[]))addMsg(m.role==='user'?'user':'ai',m.content);
  box.scrollTop=box.scrollHeight;
  if(!r.data.messages||!r.data.messages.length)showSuggestions();
}
function clearChat(){if(!confirm('清空当前对话？'))return;newChat()}

/* ===== 消息 ===== */
function addMsg(role,text){
  const box=document.getElementById('chatBox');
  const div=document.createElement('div');div.className='msg '+role;
  const inner=document.createElement('div');inner.className='bubble';
  inner.innerHTML=role==='user'?esc(text):renderMd(text);
  div.appendChild(inner);
  if(role==='ai'){
    const act=document.createElement('div');act.className='msg-actions';
    act.innerHTML=`<button class="mini" onclick="copyMsg(this)">复制</button><button class="mini" onclick="regenerate()">重新生成</button><button class="mini" onclick="fb(this,1)">👍</button><button class="mini" onclick="fb(this,-1)">👎</button>`;
    div.appendChild(act);
  }
  box.appendChild(div);box.scrollTop=box.scrollHeight;
  return div;
}
function copyMsg(btn){
  const bubble=btn.closest('.msg').querySelector('.bubble');
  const text=bubble.textContent;
  navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
}
let lastMsgId=null;
function setLastMsgId(id){lastMsgId=id}
async function fb(btn,rating){
  if(!lastMsgId)return;
  const r=await api('/feedback',{method:'POST',body:{message_id:lastMsgId,rating}});
  toast(r.ok?'已记录反馈':'反馈失败');
}

/* ===== 提问 ===== */
const SUGGESTIONS=['总结这份文档的关键内容','给出所有表格内容','有哪些图片','列出全部公式'];
function showSuggestions(){
  const box=document.getElementById('suggestions');
  box.innerHTML=SUGGESTIONS.map(s=>`<button class="sugg" onclick="useSugg(this)">${esc(s)}</button>`).join('');
}
function useSugg(btn){
  const q=document.getElementById('question');q.value=btn.textContent;autoGrow(q);q.focus();
}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,144)+'px';document.getElementById('sendBtn').disabled=!t.value.trim()||STREAMING}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}}
async function ask(){
  const q=document.getElementById('question').value.trim();
  if(!q||!KB||STREAMING)return;
  if(!SESSION)newChat();
  document.getElementById('question').value='';autoGrow(document.getElementById('question'));
  document.getElementById('suggestions').innerHTML='';
  addMsg('user',q);
  STREAMING=true;autoGrow(document.getElementById('question'));
  const aiDiv=addMsg('ai','思考中…');
  const cursor=document.createElement('span');cursor.className='typing-cursor';aiDiv.querySelector('.bubble').appendChild(cursor);
  try{
    const resp=await fetch(`${API}/chat/stream`,{method:'POST',headers:h({}),body:JSON.stringify({kb_id:KB.id,question:q,session_id:SESSION,stream:true})});
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='',answer='',sources=[];
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:'))continue;
        const payload=line.slice(5).trim();
        if(payload==='[DONE]')continue;
        try{
          const ev=JSON.parse(payload);
          if(ev.type==='sources'){sources=ev.data;if(ev.session_id){SESSION=ev.session_id;localStorage.setItem(sessKey(),SESSION)}}
          else if(ev.type==='delta'){answer+=ev.text;aiDiv.querySelector('.bubble').innerHTML=renderMd(answer)+'<span class="typing-cursor"></span>';aiDiv.scrollIntoView({block:'end'})}
          else if(ev.type==='done'){lastMsgId=ev.message_id;finalize(aiDiv,answer,sources)}
        }catch(e){}
      }
    }
  }catch(e){aiDiv.querySelector('.bubble').innerHTML='⚠️ 网络错误';}
  STREAMING=false;autoGrow(document.getElementById('question'));
}
function finalize(div,answer,sources){
  div.querySelector('.bubble').innerHTML=renderMd(answer);
  if(sources&&sources.length){
    const src=document.createElement('div');src.className='src';
    src.innerHTML='来源：'+sources.map(s=>`<b>${esc(s.doc_name)}</b>·第${s.page}页`).join('、');
    div.appendChild(src);
  }
  loadSessions();
}
async function regenerate(){
  // 简化：清掉最后一条 AI 消息，重新触发 ask（取输入框）
  const box=document.getElementById('chatBox');const msgs=box.querySelectorAll('.msg');
  const last=msgs[msgs.length-1];
  if(last&&last.classList.contains('ai'))last.remove();
  const input=document.getElementById('question');
  input.value=input.value||(msgs.length?msgs[msgs.length-2]?.querySelector('.bubble').textContent:'');autoGrow(input);
  ask();
}

/* ===== 文档上传 ===== */
function pickFile(){document.getElementById('fileIn').click()}
async function doUpload(input){
  const file=input.files[0];input.value='';if(!file||!KB)return;
  const dup=DOCS.find(d=>d.filename===file.name);
  let overwrite=false;
  if(dup){if(!confirm('已有同名文档「'+file.name+'」\n【确定】=覆盖重传'))return;overwrite=true}
  const fd=new FormData();fd.append('file',file);
  const r=await fetch(`${API}/documents?kb_id=${KB.id}&overwrite=${overwrite}`,{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});
  const d=await r.json();
  if(d.status==='indexed'){toast('已入库 '+d.filename);loadDocs()}
  else if(d.status==='processing'||d.status==='pending'){loadDocs();pollDoc(d.id)}
  else if(d.error)toast('处理失败：'+d.error);
}
function pollDoc(id){
  const t=setInterval(async()=>{
    await loadDocs();
    const doc=DOCS.find(x=>x.id===id);
    if(!doc||doc.status==='indexed'||doc.status==='failed'){clearInterval(t);if(doc&&doc.status==='indexed')toast('已入库 '+doc.filename);if(doc&&doc.status==='failed')toast('处理失败')}
  },2000);
}
async function loadDocs(){
  if(!KB)return;
  const r=await api('/documents?kb_id='+KB.id);
  const arr=r.data||[];
  const seen={};DOCS=[];
  for(const d of arr){if(!seen[d.filename]){seen[d.filename]=true;DOCS.push(d)}}
  document.getElementById('docsBox').innerHTML=DOCS.map(d=>{
    const st=d.status==='indexed'?`<span class="st ok">✓</span>`:d.status==='failed'?`<span class="st fail">✗</span>`:`<span class="st run">…<span class="pbar"><i style="width:${d.progress||0}%"></i></span>${d.progress||0}%</span>`;
    return `<div class="doc-item"><span class="nm" title="${esc(d.filename)}">${esc(d.filename)}</span>${st}<button class="mini" onclick="deleteDoc('${d.id}')">删</button></div>`;
  }).join('')||'<div class="upload-hint">暂无文档</div>';
}
async function deleteDoc(id){
  if(!confirm('确定删除该文档？'))return;
  const r=await api('/documents/'+id,{method:'DELETE'});
  if(r.ok)loadDocs();else toast('删除失败');
}

init();
</script>
